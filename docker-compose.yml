# Local services for development and tests. The API and the web app run with `npm run dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lance
      POSTGRES_PASSWORD: lance
      POSTGRES_DB: lance
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lance -d lance"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the API sends locally: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
